# ---------------------------------------------------------------------------
# TEMPLATE – Native Windows (AMD ROCm wheels from repo.amd.com)
#
# This file is intentionally NOT named pyproject.toml, so `uv sync` will not
# pick it up. Read the "Environment Setup" section in README.md, then:
#
#   copy windows.pyproject.toml pyproject.toml
#
# The values below are configured for the AMD Radeon RX 7900 XTX (gfx1100).
# For any other GPU, replace every "gfx1100" with your GPU's LLVM target
# (see the table in README.md), e.g. gfx1101 for an RX 7800 XT.
# ---------------------------------------------------------------------------

[project]
name = "yolotest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch[device-gfx1100]==2.14.0+rocm10.1.0",                 # <- adjust gfx target
    "torchvision[device-gfx1100]==0.29.0a0+rocm10.1.0",         # <- adjust gfx target
    "amd-torchvision-device-gfx1100==0.29.0a0+rocm10.1.0",      # <- adjust gfx target
    "ultralytics>=8.4.14",
]

[tool.uv]
environments = [
    "sys_platform == 'win32'",
]
override-dependencies = [
    "triton ; sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "amd-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"

[tool.uv.sources]
torch = { index = "amd-rocm" }
torchvision = { index = "amd-rocm" }
amd-torchvision-device-gfx1100 = { index = "amd-rocm" }         # <- adjust gfx target
